services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100

  api:
    build: ./backend
    container_name: grc-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Pas aan op het domein van je eigen deployment vóór de build,
        # bv. via env: NEXT_PUBLIC_API_URL=https://grc.example.org/api/v1
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: grc-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 200

volumes:
  grc_postgres_data:
    name: grc_postgres_data
