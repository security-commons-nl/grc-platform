services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    # Next.js dev (Turbopack) heeft méér geheugen nodig dan 512m — onder
    # e2e-druk werd het proces consequent OOM-killed midden in een compile,
    # waardoor de container restart en tests ERR_EMPTY_RESPONSE krijgen.
    # Voor productie (npm run start) is 512m wel voldoende; deze grens geldt
    # alleen voor de dev-image die we hier draaien.
    mem_limit: 2g
    pids_limit: 200

volumes:
  postgres_data:
