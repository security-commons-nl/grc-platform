name: Frontend

# Draait op iedere push/PR naar main (geen paths-filter) zodat deze check
# als required status check op main gezet kan worden — anders zou GitHub
# een PR die geen frontend-bestanden raakt blokkeren omdat de "verwachte"
# check niet verschijnt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Frontend lint + typecheck + test + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        env:
          # Build needs a base URL; use a dummy value for CI.
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
