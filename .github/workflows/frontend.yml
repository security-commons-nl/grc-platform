name: Frontend

# Draait op iedere push/PR naar main (geen paths-filter) zodat deze check
# als required status check op main gezet kan worden — anders zou GitHub
# een PR die geen frontend-bestanden raakt blokkeren omdat de "verwachte"
# check niet verschijnt. De workflow zelf is licht (npm ci + build, ~2 min).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint tijdelijk uitgeschakeld — eslint 10.3.0 + eslint-config-next
      # crashen op 'contextOrFilename.getFilename is not a function'.
      # Aanzetten zodra eslint-plugin-react compat met eslint 10.3+ heeft.
      # - name: Lint
      #   run: npm run lint

      - name: Build
        env:
          # Build needs a base URL; use a dummy value for CI.
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
